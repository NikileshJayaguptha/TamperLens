services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: detector
      POSTGRES_PASSWORD: detector
      POSTGRES_DB: detector
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detector"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://detector:detector@db:5432/detector
      CORS_ORIGINS: http://localhost:3000
      CLASSIFIER_WEIGHT: "0.7"
    volumes:
      - ./data:/data
      - ./models:/models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
